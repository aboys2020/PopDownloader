name: Build Standalone Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 构建环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. 安装项目依赖
        run: |
          npm install

      - name: 4. 构建前端网页 (Vite Build)
        run: |
          npm run build

      - name: 5. 打包 Node.js 后端为单文件 EXE
        run: |
          npx --yes pkg server/index.js --targets node18-win-x64 --output release/PopMusic.exe

      - name: 6. 提取依赖文件与前端资源
        run: |
          xcopy dist release\dist /E /I /H /Y
          copy node_modules\@ffmpeg-installer\win32-x64\ffmpeg.exe release\ffmpeg.exe

      - name: 7. 上传可执行绿色压缩包
        uses: actions/upload-artifact@v4
        with:
          name: PopMusic-Windows-Portable
          path: release/
