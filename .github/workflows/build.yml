name: Build Standalone Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 20 构建环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. 安装项目依赖
        run: |
          npm install

      - name: 4. 构建前端网页 (Vite Build)
        run: |
          npm run build

      - name: 5. 打包 Node.js 后端为单文件 EXE (使用支持 Node 20 的 @yao-pkg/pkg)
        run: |
          npx --yes @yao-pkg/pkg server/index.js --targets node20-win-x64 --output release/PopMusic.exe

      - name: 6. 提取原生二进制依赖 (ffmpeg.exe 与 better_sqlite3.node) 及前端资源
        shell: powershell
        run: |
          xcopy dist release\dist /E /I /H /Y
          if (Test-Path "node_modules\@ffmpeg-installer\win32-x64\ffmpeg.exe") {
              copy "node_modules\@ffmpeg-installer\win32-x64\ffmpeg.exe" "release\ffmpeg.exe"
          }
          Get-ChildItem -Path node_modules\better-sqlite3 -Filter better_sqlite3.node -Recurse | Select-Object -First 1 | Copy-Item -Destination release\better_sqlite3.node

      - name: 7. 上传打包完成的可执行绿色解压包
        uses: actions/upload-artifact@v4
        with:
          name: PopMusic-Windows-Portable
          path: release/
